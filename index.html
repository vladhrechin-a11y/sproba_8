<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071b2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Підтримка поруч — Вхід</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#06182a,#0b2944 65%,#123b61);color:#17212b}
.login-card{width:min(440px,100%);background:#fff;border-radius:18px;padding:30px 24px 24px;box-shadow:0 24px 70px rgba(0,0,0,.3);border-top:5px solid #ffd500}
.logo{width:88px;height:88px;margin:0 auto 18px;border-radius:18px;overflow:hidden;background:#071b2f}.logo img{width:100%;height:100%;object-fit:cover}
h1{text-align:center;color:#071b2f;margin:0 0 6px;font-size:28px} .sub{text-align:center;color:#687680;margin:0 0 26px}
label{display:block;font-size:13px;font-weight:700;color:#071b2f;margin:0 0 7px}
input{width:100%;padding:14px 15px;border:1px solid #d9e1e7;border-radius:10px;font-size:16px;outline:none;margin-bottom:14px}
input:focus{border-color:#123b61;box-shadow:0 0 0 3px rgba(18,59,97,.1)}
button{width:100%;border:0;border-radius:10px;padding:15px;background:#071b2f;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
button:hover{background:#0b2944}.error{display:none;margin:12px 0 0;padding:11px 12px;background:#fff1f1;color:#b71c1c;border-radius:9px;text-align:center;font-size:14px}
.note{text-align:center;color:#87939b;font-size:12px;margin-top:18px;line-height:1.4}
#install{display:none;margin-top:10px;background:#ffd500;color:#071b2f}
</style>
</head>
<body>
<main class="login-card">
  <div class="logo"><img src="icon-192.png" alt="Підтримка поруч"></div>
  <h1>Підтримка поруч</h1>
  <p class="sub">Захищений вхід до навчального ресурсу</p>
  <form id="loginForm">
    <label for="login">Логін</label>
    <input id="login" autocomplete="username" required>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">УВІЙТИ</button>
    <div id="error" class="error">Невірний логін або пароль.</div>
  </form>
  <button id="install">➕ ДОДАТИ НА ГОЛОВНИЙ ЕКРАН</button>

</main>
<script src="auth.js"></script>
<script>
if(PIDTRYMKA_AUTH.isLoggedIn()) location.replace('app.html');
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const ok=PIDTRYMKA_AUTH.signIn(document.getElementById('login').value.trim(),document.getElementById('password').value);
  if(ok) location.replace('app.html'); else document.getElementById('error').style.display='block';
});
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').style.display='block';});
document.getElementById('install').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(console.error));
</script>
</body>
</html>
